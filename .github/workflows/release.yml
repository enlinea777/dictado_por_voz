name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Construyendo versión $V"

  deb:
    name: Debian (.deb)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir paquete
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh
      - name: Comprobar contenido
        run: |
          dpkg-deb --info deb-build/*.deb
          dpkg-deb -c deb-build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: deb-build/*.deb
          if-no-files-found: error

  rpm:
    name: Fedora (.rpm)
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Herramientas
        run: dnf install -y git tar gzip rpm-build
      - uses: actions/checkout@v4
      - name: Construir paquete
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          git config --global --add safe.directory "$PWD"
          mkdir -p "$HOME/rpmbuild/SOURCES" "$HOME/rpmbuild/SPECS"
          git archive --format=tar.gz --prefix="dictado-$VERSION/" \
              -o "$HOME/rpmbuild/SOURCES/dictado-$VERSION.tar.gz" HEAD
          sed "s/^Version:.*/Version: $VERSION/" packaging/rpm/dictado.spec \
              > "$HOME/rpmbuild/SPECS/dictado.spec"
          rpmbuild -ba "$HOME/rpmbuild/SPECS/dictado.spec"
          mkdir -p /out && cp "$HOME"/rpmbuild/RPMS/*/*.rpm /out/
          ls -l /out
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: /out/*.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Herramientas
        run: pacman -Syu --noconfirm --needed git base-devel
      - uses: actions/checkout@v4
      - name: Construir paquete
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          git config --global --add safe.directory "$PWD"
          mkdir -p /build/packaging/arch
          cp packaging/arch/PKGBUILD packaging/arch/dictado.install \
              /build/packaging/arch/
          git archive --format=tar.gz --prefix="dictado-$VERSION/" \
              -o "/build/packaging/arch/dictado-$VERSION.tar.gz" HEAD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" /build/packaging/arch/PKGBUILD
          useradd -m builder
          chown -R builder:builder /build
          cd /build/packaging/arch
          runuser -u builder -- makepkg -d --noconfirm
          mkdir -p /out && cp ./*.pkg.tar.zst /out/
          ls -l /out
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: /out/*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows (instalador .exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Construir ejecutable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name Dictado `
            --icon packaging/icon/dictado.ico `
            --collect-all sounddevice `
            --collect-submodules pystray `
            --hidden-import pystray._win32 `
            dictado.py
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          Copy-Item dist/Dictado.exe packaging/windows/Dictado.exe
          Copy-Item packaging/icon/dictado.ico packaging/windows/dictado.ico
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$ver" "packaging\windows\dictado.iss"
          Get-ChildItem packaging/windows/Output
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/windows/Output/*.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Construir .app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name Dictado \
            --icon packaging/icon/dictado.icns \
            --osx-bundle-identifier io.github.enlinea777.Dictado \
            --collect-all sounddevice \
            --collect-submodules pystray \
            dictado.py
          PLIST=dist/Dictado.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string \
            'Dictado por Voz necesita el microfono para transcribir tu voz.'" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription \
            'Dictado por Voz necesita el microfono para transcribir tu voz.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST" || true
          codesign --force --deep --sign - dist/Dictado.app
      - name: Crear DMG
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p dmg
          cp -R dist/Dictado.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dictado" -srcfolder dmg -ov -format UDZO \
            "Dictado-$VERSION-macos-${{ matrix.arch }}.dmg"
          ls -l ./*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ./*.dmg
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onedir \
            --name Dictado \
            --collect-all sounddevice \
            --collect-submodules pystray \
            dictado.py
      - name: AppDir
        run: |
          set -eux
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a dist/Dictado/. AppDir/usr/bin/
          cp packaging/appimage/dictado.desktop AppDir/usr/share/applications/
          # appimagetool exige el .desktop también en la raíz del AppDir
          cp packaging/appimage/dictado.desktop AppDir/dictado.desktop
          cp packaging/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          python - <<'PY'
          from PIL import Image
          Image.open("packaging/icon/dictado.png").resize((256, 256)).save(
              "AppDir/usr/share/icons/hicolor/256x256/apps/dictado.png")
          PY
          cp AppDir/usr/share/icons/hicolor/256x256/apps/dictado.png AppDir/dictado.png
          ln -sf usr/share/icons/hicolor/256x256/apps/dictado.png AppDir/.DirIcon
      - name: appimagetool
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir \
            "dictado-${VERSION}-${ARCH}.AppImage"
          ls -l ./*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: ./*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Construir y empaquetar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=repo build \
            packaging/flatpak/io.github.enlinea777.Dictado.yml
          flatpak build-bundle repo \
            "dictado-${VERSION}-${{ matrix.arch }}.flatpak" \
            io.github.enlinea777.Dictado
          ls -l ./*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: ./*.flatpak
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [version, deb, rpm, arch, windows, macos, appimage, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Preparar notas
        run: |
          find dist -type f -printf '%p (%s bytes)\n'
          {
            echo "## Dictado por Voz ${{ needs.version.outputs.version }}"
            echo
            echo "Paquetes generados automáticamente por GitHub Actions:"
            echo
            echo "| Distro | Archivo | Instalación |"
            echo "|---|---|---|"
            echo "| Debian/Ubuntu | \`dictado_*_all.deb\` | \`sudo apt install ./archivo.deb\` |"
            echo "| Fedora | \`dictado-*.noarch.rpm\` | \`sudo dnf install ./archivo.rpm\` |"
            echo "| Arch Linux | \`dictado-*.pkg.tar.zst\` | \`sudo pacman -U ./archivo.pkg.tar.zst\` |"
            echo "| Windows 10/11 | \`dictado-*-setup.exe\` | ejecutar el instalador |"
            echo "| macOS (Intel/ARM) | \`Dictado-*-macos-*.dmg\` | abrir el DMG y arrastrar a Aplicaciones |"
            echo "| Linux (x86_64/ARM) | \`dictado-*.AppImage\` | \`chmod +x\` y ejecutar |"
            echo "| Linux (Flatpak) | \`dictado-*.flatpak\` | \`flatpak install ./archivo.flatpak\` |"
            echo
            echo "Los paquetes \`.deb\`, \`.rpm\` y de Arch son independientes de la"
            echo "arquitectura (\`all\`/\`noarch\`): sirven tanto en x86_64 como en ARM."
            echo
            echo "También puedes usar el script portable \`dictado-portable.sh\` (sin instalar)."
            echo
            echo "> Los paquetes crean el entorno Python en \`/var/lib/dictado/venv\`"
            echo "> durante la instalación (necesita conexión a internet)."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Dictado por Voz ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.pkg.tar.zst
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.flatpak
            dictado-portable.sh
